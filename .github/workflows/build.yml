name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 240

    steps:
      - name: Move vcpkg to D drive
        shell: pwsh
        run: |
          if ((Test-Path 'D:\') -and (Test-Path 'C:\vcpkg')) {
            Copy-Item -Path 'C:\vcpkg' -Destination 'D:\vcpkg' -Recurse -Force
            Add-Content -Path $env:GITHUB_PATH -Value 'D:\vcpkg'
            Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=D:/vcpkg"
          }

      - name: Checkout source and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: D:\vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
          save-always: true

      - name: Configure vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'D:\vcpkg-cache' | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value 'VCPKG_BINARY_SOURCES=clear;files,D:\vcpkg-cache,readwrite'

      - name: Integrate vcpkg with MSBuild
        run: vcpkg integrate install

      - name: Build Heal Stats only - Release x64
        shell: pwsh
        run: |
          Write-Host "Building only the arcdps_healing_stats target and required dependencies"
          msbuild arcdps_personal_stats.sln /m /t:arcdps_healing_stats /p:Configuration=Release /p:Platform=x64 /v:minimal

      - name: Collect Heal Stats DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path . -Recurse -Filter arcdps_healing_stats.dll -File |
            Where-Object { $_.FullName -notmatch 'vcpkg_installed' } |
            Select-Object -First 1
          if ($null -eq $dll) {
            Write-Error "arcdps_healing_stats.dll was not produced by the build."
            exit 1
          }
          Copy-Item $dll.FullName -Destination .\arcdps_healing_stats_GW2_UI.dll -Force
          Write-Host "Collected $($dll.FullName)"

      - name: Upload ready-to-install DLL
        uses: actions/upload-artifact@v4
        with:
          name: arcdps_healing_stats_GW2_UI
          path: arcdps_healing_stats_GW2_UI.dll
          if-no-files-found: error
